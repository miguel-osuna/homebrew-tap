name: Validate Sweepdeck cask
on:
  pull_request:
    paths:
      - "Casks/**"
  push:
    branches: [master]
    paths:
      - "Casks/**"
permissions:
  contents: read
jobs:
  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a disposable Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Update Homebrew on the disposable runner
        run: |
          brew update
          echo 'HOMEBREW_NO_AUTO_UPDATE=1' >> "$GITHUB_ENV"
      - name: Create a local tap from the reviewed cask
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          local_tap="$RUNNER_TEMP/homebrew-tap"
          mkdir -p "$local_tap"
          cp -R Casks "$local_tap/Casks"
          git -C "$local_tap" init --quiet --initial-branch=main
          git -C "$local_tap" config user.name "Homebrew cask validation"
          git -C "$local_tap" config user.email "homebrew-cask-validation@users.noreply.github.com"
          git -C "$local_tap" add Casks
          git -C "$local_tap" commit --quiet -m "Validate reviewed cask"
          brew tap miguel-osuna/tap "$local_tap"
      - name: Audit cask metadata
        run: brew audit --cask --strict miguel-osuna/tap/sweepdeck
      - name: Check cask style
        run: brew style --cask miguel-osuna/tap/sweepdeck
      - name: Install the published cask
        run: brew install --cask miguel-osuna/tap/sweepdeck
      - name: Inspect installed app and report first-launch approval behavior
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          app="/Applications/Sweepdeck.app"
          state="$RUNNER_TEMP/SweepdeckState"
          mkdir -p "$state"
          test -d "$app/Contents/MacOS"
          test -f "$app/Contents/Info.plist"
          brew info --cask miguel-osuna/tap/sweepdeck
          brew list --cask --full-name | grep -Fx miguel-osuna/tap/sweepdeck
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/Sweepdeck"
          find "$app" -maxdepth 4 -print
          printf 'Homebrew quarantine: '
          xattr -p com.apple.quarantine "$app"
          codesign --verify --strict "$app"
          signature_info="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
          printf '%s\n' "$signature_info"
          grep -Fq 'Signature=adhoc' <<<"$signature_info"
          set +e
          spctl --assess --type execute --verbose=4 "$app"
          gatekeeper_status=$?
          set -e
          if [[ "$gatekeeper_status" -ne 0 && "$gatekeeper_status" -ne 3 ]]; then
            echo "Unexpected Gatekeeper assessment status: $gatekeeper_status" >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/Sweepdeck-first-launch.png"
          set +e
          open -a "$app" --args --sweepdeck-state-directory "$state" >"$RUNNER_TEMP/Sweepdeck-first-launch.txt" 2>&1 &
          open_pid=$!
          launch_started="$SECONDS"
          open_status=0
          for _ in {1..15}; do
            if [[ ! -e "$RUNNER_TEMP/Sweepdeck-first-launch.png" && "$((SECONDS - launch_started))" -ge 3 ]]; then
              if screencapture -x "$RUNNER_TEMP/Sweepdeck-first-launch.png" >/dev/null 2>&1; then
                echo "Captured first-launch screen for review."
              else
                rm -f "$RUNNER_TEMP/Sweepdeck-first-launch.png"
                echo "The disposable runner did not provide a capturable user session."
              fi
            fi
            if ! kill -0 "$open_pid" >/dev/null 2>&1; then
              if wait "$open_pid"; then open_status=0; else open_status=$?; fi
              break
            fi
            sleep 1
          done
          if kill -0 "$open_pid" >/dev/null 2>&1; then
            echo "Launch Services did not return within 15 seconds." >>"$RUNNER_TEMP/Sweepdeck-first-launch.txt"
            kill -TERM "$open_pid" >/dev/null 2>&1 || true
            wait "$open_pid" >/dev/null 2>&1 || true
            open_status=124
          fi
          set -e
          sleep 5
          if pgrep -x Sweepdeck >/dev/null 2>&1; then
            launch_status=0
            process_id="$(pgrep -x Sweepdeck | head -n 1)"
            process_command="$(ps -p "$process_id" -o command=)"
            printf 'Sweepdeck process: %s\n' "$process_command"
            [[ "$process_command" == *"--sweepdeck-state-directory"* && "$process_command" == *"$state"* ]] || {
              echo "Sweepdeck did not receive the temporary state directory argument." >&2
              exit 1
            }
          else
            launch_status=1
          fi
          cat "$RUNNER_TEMP/Sweepdeck-first-launch.txt"
          printf 'Gatekeeper status: %s; Launch Services status: %s; app process: %s\n' \
            "$gatekeeper_status" "$open_status" "$launch_status"
          if [[ "$gatekeeper_status" -eq 0 && "$launch_status" -ne 0 ]]; then
            echo "Gatekeeper accepted the app, but the process did not start." >&2
            exit 1
          fi
          if [[ "$gatekeeper_status" -eq 3 ]]; then
            echo "Gatekeeper rejected the ad-hoc signed app for unattended launch."
            echo "The user may need to approve it in System Settings > Privacy & Security."
            echo "The test did not simulate that approval or remove quarantine."
          fi
          if [[ "$launch_status" -eq 0 ]]; then
            pkill -TERM -x Sweepdeck
            for _ in {1..10}; do
              pgrep -x Sweepdeck >/dev/null 2>&1 || break
              sleep 1
            done
            ! pgrep -x Sweepdeck >/dev/null 2>&1
          fi
      - name: Preserve disposable first-launch screen for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweepdeck-first-launch-screen-${{ github.run_id }}
          path: ${{ runner.temp }}/Sweepdeck-first-launch.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Uninstall the app
        if: always()
        run: |
          set -euo pipefail
          pkill -TERM -x Sweepdeck >/dev/null 2>&1 || true
          if brew list --cask --full-name 2>/dev/null | grep -Fxq "miguel-osuna/tap/sweepdeck"; then
            brew uninstall --cask miguel-osuna/tap/sweepdeck
          fi
          test ! -e /Applications/Sweepdeck.app
